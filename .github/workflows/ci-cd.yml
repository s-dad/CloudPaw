# Lint and test every push and pull request to main. Nothing is deployed from
# here: the frontend moves to S3 + CloudFront and the backend to API Gateway +
# Lambda, and their deploy jobs come with that migration. (The old GitHub Pages
# deploy was removed: the site there could never reach an API.)
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Lint HTML
        run: npx htmlhint@1.9.2 "**/*.html"

  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Install backend dependencies
        run: npm ci
      - name: Run backend tests
        run: npm test
